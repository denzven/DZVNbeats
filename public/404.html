<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DZVNbeats | Studio Beat Portfolio</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <script>
      // Single Page App redirect for GitHub Pages (https://denzven.github.io/DZVNbeats/)
      // If someone accesses /DZVNbeats/beat/<id>, /DZVNbeats/beats, or any direct link, redirect into HashRouter
      (function () {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Detect repository / base path for GitHub Pages (e.g. /DZVNbeats/)
        var base = "/";
        var repoMatch = pathname.match(/^\/([^\/]+)/);
        if (
          window.location.hostname.endsWith("github.io") ||
          (repoMatch && repoMatch[1].toLowerCase() === "dzvnbeats")
        ) {
          base = "/" + (repoMatch ? repoMatch[1] : "DZVNbeats") + "/";
        }

        // Get the route path relative to the base
        var routePath = pathname;
        if (routePath.indexOf(base) === 0) {
          routePath = routePath.slice(base.length);
        } else if (routePath.startsWith("/")) {
          routePath = routePath.slice(1);
        }
        // Remove trailing 404.html or slashes
        routePath = routePath.replace(/404\.html$/, "").replace(/\/$/, "");

        // 1. Direct Beat Link: /DZVNbeats/beat/<beatId> or /beat/<beatId>
        var beatMatch = routePath.match(/^beat\/([^\/\?#]+)/);
        if (beatMatch && beatMatch[1]) {
          var beatId = beatMatch[1];
          window.location.replace(base + "#/beats?play=" + encodeURIComponent(beatId));
          return;
        }

        // 2. Direct Beats Page with query (e.g. /DZVNbeats/beats?play=akbaar)
        if (routePath === "beats" || routePath.startsWith("beats/")) {
          window.location.replace(base + "#/beats" + search + hash);
          return;
        }

        // 3. Other Routes (e.g. /DZVNbeats/licensing)
        if (routePath) {
          window.location.replace(base + "#/" + routePath + search + hash);
          return;
        }

        // 4. Default fallback to root
        window.location.replace(base + (search || "") + (hash || ""));
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .loader {
        width: 32px;
        height: 32px;
        border: 3px solid #27272a;
        border-top-color: #fafafa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="loader"></div>
      <p>Redirecting to DZVNbeats...</p>
    </div>
  </body>
</html>
